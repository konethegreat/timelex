# Written by Kone Tshivhinda & Claude
# Capture service contract v1 (draft 0.3.0). Contract-first: this file leads the code (ADR-0001).
# Design: ADR-0021 (idempotent ingest, connector cursors, replay), ADR-0022 (manual quick capture),
# ADR-0023 (privacy exclusions and the metadata-only gate).
openapi: 3.1.0
info:
  title: TimeLex Capture
  version: 0.3.0
  summary: Idempotent ingest of activity events from connectors, the desktop agent and manual capture (pre-alpha).
  description: |
    Pre-alpha. The capture hub normalises a raw work signal into one immutable activity event
    (ADR-0006) and stores it exactly once. A connector fetches from its own system, builds the event
    and posts it here; the service decides whether the signal is new. Real Microsoft 365 and Google
    connectors arrive with P2-03 and P2-05. Since 0.2.0 a person can also record work by hand:
    `POST /v1/entries` derives the event from a short form (ADR-0022) and the gateway exposes it at
    `POST /v1/capture/entries`.

    **Privacy exclusions.** Since 0.3.0 a firm can exclude a `domain`, a `client` or a `matter`
    (ADR-0023). A domain is enforced before storage: an event with a participant at the excluded
    domain is not stored and publishes nothing, and a connector page still advances its cursor past
    it. Client and matter exclusions are configuration for attribution (P3); a raw signal names
    neither. Managing exclusions needs `settings:manage`. Content is metadata-only by default: an
    event may name a `contentRef` only when it captured content, and captured content is stored only
    after redaction.

    **Why a caller can post the same event twice.** Every event carries a canonical `id` derived from
    the firm, the source system, the source id and the start instant ([the id rule](../events/README.md)).
    Delivering the same signal twice produces the same `id`, so the second delivery finds the stored
    row and changes nothing: the event is stored once and `activity.recorded` is published once
    (ADR-0014). A delivery that claims a new `id` is rejected unless the `id` is the one its content
    implies, so a sender cannot force a second copy. A manual entry carries the caller's own
    `entryId`, which is that signal's source id: a retry after a lost response is the same signal.

    **Callers.** Only the gateway reaches this service, over a private interface, with an *internal
    token* signed by the gateway (ADR-0012). Every ingest requires a token of kind `principal` whose
    holder has the `capture:write` permission; the firm, user and permissions come from the verified
    token, never from the request. A token of the wrong kind or without the permission is 403. An
    event's `tenantId` must name the caller's firm and its `actor.userId` must be the caller (400 and
    403 respectively). A manual entry does not name either: both come from the token.

    **Public path.** `/v1/entries` is the service's private path; the only public route in 0.2.0 is
    the gateway's `POST /v1/capture/entries`. `/v1/events` stays private until a connector is deployed
    behind the gateway (P2-03).

    **Versioning.** `schemaVersion` is the event's version, not this contract's. This build reads
    every `1.x`; a `2.x` event is a 400. See [event contracts](../events/README.md).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8084
    description: Local development (private interface; the gateway fronts this in every other environment)
tags:
  - name: events
    description: Record an activity event exactly once.
  - name: entries
    description: Record work by hand when no connector saw it.
  - name: exclusions
    description: Configure what capture must never store (ADR-0023).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and database reachability
      description: Answers 200 when the service is up and can reach its database, otherwise 503. No credentials; reachable only on the private interface.
      security: []
      responses:
        "200":
          description: Up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        "503":
          description: The database cannot be reached.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/events:
    post:
      tags: [events]
      operationId: ingestEvent
      summary: Record one activity event (idempotent)
      description: |
        Stores the event if its `id` has not been seen for this firm, and answers 201. If the id is
        already stored, answers 200 with `created: false` and changes nothing: no second row and no
        second `activity.recorded`. The signal is never edited, so a later delivery with different
        content but the same id is still a duplicate; a sender that wants to correct a signal
        publishes a new event that cites the earlier one.

        The `id` must equal the canonical id of the event's `tenantId`, `source.system`,
        `source.sourceId` and `startedAt` (whole seconds); anything else is a 400. The event body must
        satisfy [`activity-event.schema.json`](../events/activity-event.schema.json) for a supported
        major; unknown optional properties are ignored (P2-01).

        An event whose participant is at a domain the firm excludes is **not stored** and publishes
        nothing. It answers 200 with `created: false`, exactly like a duplicate, so a sender may
        retry without learning which privacy rule applied. A `contentRef` without captured content,
        or captured content that was not redacted, is a 400 (metadata-only default).
      security: [{ internalToken: [] }]
      x-required-kind: principal
      x-required-permission: capture:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityEvent" }
      responses:
        "201":
          description: The event was stored for the first time.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "200":
          description: The same signal was delivered before; nothing changed.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/entries:
    post:
      tags: [entries]
      operationId: createEntry
      summary: Record work by hand (idempotent)
      description: |
        Builds an activity event from the form and stores it exactly once. The firm, the user and
        `capturedAt` come from the verified token and the server clock. `description` becomes
        `subject.title` with runs of whitespace collapsed to one line, and is the only free text
        kept; `privacy.contentCaptured` is always false, so a quick capture stores metadata, never
        content. Nothing else in the event can be chosen by the caller.

        `entryId` is the caller's idempotency key and becomes the event's `source.sourceId`, so
        repeating the request with the same `entryId` and `startedAt` answers 200 and changes nothing.
        A retry after a lost response is therefore safe. The kinds a person may capture are `call`,
        `meeting` and `manual_entry`; everything else has an automated source.
      security: [{ internalToken: [] }]
      x-required-kind: principal
      x-required-permission: capture:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualEntry" }
      responses:
        "201":
          description: The entry became a new activity event.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "200":
          description: The same entry was delivered before; nothing changed.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/exclusions:
    get:
      tags: [exclusions]
      operationId: listExclusions
      summary: List the firm's privacy exclusions
      description: |
        Every exclusion the firm configured, ordered by kind and value. Domain values are stored
        lower-case with no trailing dot; client and matter identifiers keep their case. Requires
        `settings:manage` (ADR-0023).
      security: [{ internalToken: [] }]
      x-required-kind: principal
      x-required-permission: settings:manage
      responses:
        "200":
          description: The firm's exclusions.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExclusionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [exclusions]
      operationId: addExclusion
      summary: Configure a privacy exclusion (idempotent)
      description: |
        Values are canonicalised: a domain is trimmed, lower-cased and loses one leading `@` and one
        trailing dot; a client or matter identifier is trimmed. A domain exclusion covers the named
        domain and every subdomain. Adding the same kind and value twice answers 200 with
        `created: false` and keeps the first reason. Requires `settings:manage`.
      security: [{ internalToken: [] }]
      x-required-kind: principal
      x-required-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewExclusion" }
      responses:
        "201":
          description: The exclusion is new.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExclusionResult" }
        "200":
          description: The firm already excluded this kind and value; nothing changed.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: "no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExclusionResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/exclusions/{kind}/{value}:
    delete:
      tags: [exclusions]
      operationId: removeExclusion
      summary: Stop excluding a domain, client or matter
      description: |
        Removes the exclusion. A domain value is canonicalised before it is looked up, so the case
        and a trailing dot do not matter. Removing an exclusion does not restore signals dropped
        while it was in force. Requires `settings:manage`.
      security: [{ internalToken: [] }]
      x-required-kind: principal
      x-required-permission: settings:manage
      parameters:
        - name: kind
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ExclusionKind" }
        - name: value
          in: path
          required: true
          description: The value as configured; domains ignore case and a trailing dot.
          schema: { type: string, minLength: 1, maxLength: 320 }
      responses:
        "204":
          description: Removed.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema: { type: string, const: "no-store" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The firm has no such exclusion.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500": { $ref: "#/components/responses/Internal" }
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      description: A short-lived token signed by the gateway (ADR-0012, `contracts/internal-auth.md`). Never a tenant API key.
  schemas:
    ActivityEvent:
      type: object
      description: One observed work signal. Mirrors [`activity-event.schema.json`](../events/activity-event.schema.json); that file is the normative definition and its versioning rules apply.
      required: [schemaVersion, id, tenantId, source, kind, actor, startedAt, endedAt, capturedAt, privacy]
      properties:
        schemaVersion:
          type: string
          pattern: "^1\\.[0-9]+$"
          description: The event's major.minor version. This build reads every 1.x.
        id:
          type: string
          pattern: "^ae_[0-9a-f]{16,64}$"
          description: Canonical id of the signal; the same signal always has the same id.
        tenantId: { type: string, pattern: "^tn_[0-9A-Za-z]{8,64}$" }
        source:
          type: object
          required: [system, sourceId]
          properties:
            system:
              type: string
              enum: [m365_mail, m365_calendar, m365_teams, google_mail, google_calendar, desktop_agent, manual, import]
            sourceId:
              type: string
              description: Id of the signal in the originating system.
              minLength: 1
              maxLength: 512
        kind:
          type: string
          enum: [email_sent, email_received, meeting, call, document_edit, document_view, web_research, desktop_focus, manual_entry]
        actor:
          type: object
          required: [userId]
          properties:
            userId: { type: string, pattern: "^us_[0-9A-Za-z]{8,64}$" }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        capturedAt: { type: string, format: date-time }
        subject:
          type: object
          description: Metadata about the signal. Titles and addresses may be absent under a metadata-only or redacted privacy tier.
          properties:
            title: { type: string, maxLength: 500 }
            threadRef: { type: string, maxLength: 512 }
            documentRef: { type: string, maxLength: 512 }
            participants:
              type: array
              maxItems: 200
              items:
                type: object
                required: [role, domain]
                properties:
                  role: { type: string, enum: [from, to, cc, attendee, organizer] }
                  domain: { type: string, maxLength: 255 }
                  address: { type: string, maxLength: 320 }
        contentRef:
          type: string
          maxLength: 512
          description: Object-storage key of redacted content, present only when privacy.contentCaptured is true.
        privacy:
          type: object
          required: [contentCaptured, redactionApplied]
          properties:
            contentCaptured: { type: boolean }
            redactionApplied: { type: boolean }
    IngestResult:
      type: object
      required: [id, created]
      properties:
        id:
          type: string
          description: The event's canonical id, echoed so a sender can record what the service kept.
        created:
          type: boolean
          description: True when this delivery stored the event; false when it was already stored or the firm excludes the signal.
    ExclusionKind:
      type: string
      enum: [domain, client, matter]
      description: What is excluded. A domain is enforced at capture; client and matter are enforced when attribution exists (P3).
    Exclusion:
      type: object
      required: [kind, value, createdAt]
      properties:
        kind: { $ref: "#/components/schemas/ExclusionKind" }
        value:
          type: string
          description: The canonical value. Domains are lower-case with no trailing dot.
        reason:
          type: string
          maxLength: 500
          description: An optional note from the person who configured it.
        createdAt: { type: string, format: date-time }
    NewExclusion:
      type: object
      required: [kind, value]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/ExclusionKind" }
        value:
          type: string
          minLength: 1
          maxLength: 253
          description: A domain (case-insensitive, subdomains included) or a client or matter identifier of at most 128 characters.
        reason:
          type: string
          maxLength: 500
          description: An optional note, plain text only.
    ExclusionList:
      type: object
      required: [exclusions]
      properties:
        exclusions:
          type: array
          items: { $ref: "#/components/schemas/Exclusion" }
    ExclusionResult:
      type: object
      required: [kind, value, created]
      properties:
        kind: { $ref: "#/components/schemas/ExclusionKind" }
        value: { type: string }
        created:
          type: boolean
          description: True when this call added the exclusion; false when it was already there.
    ManualEntry:
      type: object
      description: What a person submits for quick capture. The server derives the event.
      required: [entryId, kind, startedAt, endedAt]
      additionalProperties: false
      properties:
        entryId:
          type: string
          format: uuid
          description: The caller's idempotency key. Any accepted UUID spelling; the same key and start is the same signal.
        kind:
          type: string
          enum: [call, meeting, manual_entry]
          description: What the person did. `manual_entry` covers work that fits no other kind.
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        description:
          type: string
          maxLength: 500
          description: Optional short description, stored as `subject.title`. Whitespace is collapsed to one line.
    Problem:
      description: RFC 9457 problem details (standard error body for all services).
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
  responses:
    Invalid:
      description: The event is malformed, names an unsupported major, or carries an id that does not match its content.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, malformed or invalid internal token. Always the same body.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: A valid token of the wrong kind, one without the permission the route needs (`capture:write` for ingest, `settings:manage` for exclusions), or an event whose actor is not the caller.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: The request body exceeds 64 KiB.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Internal:
      description: The capture service or its database failed. `detail` is never included.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
