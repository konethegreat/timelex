# Written by Kone Tshivhinda & Claude
# Gateway contract v1 (draft 0.3.0). Contract-first: this file leads the code (ADR-0001).
# Internal design: ADR-0012, ADR-0013 and contracts/internal-auth.md. Service contracts it fronts: identity.v1.yaml.
openapi: 3.1.0
info:
  title: TimeLex Gateway
  version: 0.3.0
  summary: Edge API for TimeLex (pre-alpha).
  description: |
    Pre-alpha. `/health` and `/v1/meta` are open. Since 0.2.0 the gateway authenticates callers and
    routes three identity operations (`createTenant`, `issueApiKey`, `revokeApiKey`). Since 0.3.0 it
    also enforces per-firm request limits, records usage metadata and routes MCP `tools/call` requests
    by header. Everything else arrives with its service. Every capability is also exposed as MCP
    tools; see `contracts/mcp/tools.md`.

    **Authentication.** Tenant calls carry `Authorization: Bearer tlx_...` (an API key from
    `issueApiKey` or `createTenant`). The gateway checks the key with the identity service on **every**
    request, so a revoked key or a removed role stops working at once. Operator calls (`createTenant`)
    carry the platform operator's credential instead. Any other, missing or malformed credential gets the
    same 401, whatever the reason.

    **Tenant comes from the credential, never from the request.** The gateway discards any client
    `X-TimeLex-*` header and the original `Authorization` header before forwarding, and never forwards
    the API key itself: services receive a short-lived internal token (ADR-0012).

    **Not routable from outside.** `authenticate` (identity) is internal. A request to it through the
    gateway is a 404, like any unknown path.

    **Limits.** Request bodies larger than 64 KiB get 413. An upstream that does not answer within
    5 seconds gets 504; one that cannot be reached gets 502. The gateway forwards nothing unless
    authentication completed. Each firm gets 600 requests a minute with a burst of 120 by default;
    both are configurable. The platform operator gets 60 a minute. A caller over its budget gets 429
    with `Retry-After` (ADR-0013). Usage metering records request metadata only, never the body or the
    credential.

    **MCP.** `POST /mcp` routes a request by its `MCP-Protocol-Version` and `Mcp-Method` headers and,
    for `tools/call`, by the tool name in `Mcp-Name`, without parsing the body. Only `tools/call` is
    routed in 0.3.0; other methods answer 501 until P1-15. The service re-checks the headers against
    the body and enforces `Origin`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8088
    description: Local development
security:
  - apiKey: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Gateway is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /v1/meta:
    get:
      operationId: getMeta
      summary: Build and contract metadata
      security: []
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema:
                type: object
                required: [name, version, contracts, stage]
                properties:
                  name: { type: string }
                  version: { type: string }
                  stage: { type: string, description: "pre-alpha | alpha | beta | stable" }
                  contracts:
                    type: object
                    required: [activityEvent]
                    properties:
                      activityEvent: { type: string, description: "Activity-event schema version, e.g. 1.0" }
  /v1/tenants:
    post:
      operationId: createTenant
      summary: Create a firm and its first administrator (platform operators only)
      description: Routed to identity. Same request and response as `identity.v1.yaml` `createTenant`.
      security: [{ operatorKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "identity.v1.yaml#/components/schemas/CreateTenantRequest" }
      responses:
        "201":
          description: Firm created. The token in `initialApiKey` is shown only now.
          content:
            application/json:
              schema: { $ref: "identity.v1.yaml#/components/schemas/CreateTenantResponse" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The slug is already taken.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/api-keys:
    post:
      operationId: issueApiKey
      summary: Issue an API key
      description: Routed to identity. Requires `keys:manage`. Same request and response as `identity.v1.yaml` `issueApiKey`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "identity.v1.yaml#/components/schemas/IssueApiKeyRequest" }
      responses:
        "201":
          description: Key issued. The token is shown only now.
          content:
            application/json:
              schema: { $ref: "identity.v1.yaml#/components/schemas/IssuedApiKey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /v1/api-keys/{keyId}/revoke:
    post:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Routed to identity. Requires `keys:manage`. Takes effect immediately.
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { $ref: "identity.v1.yaml#/components/schemas/Uuid" }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /mcp:
    post:
      operationId: mcpPost
      summary: MCP Streamable HTTP endpoint (stateless, 2026-07-28)
      description: |
        Routes one MCP request without parsing the JSON body. `Mcp-Method` must be `tools/call`; the
        tool named in `Mcp-Name` is looked up in `contracts/mcp/routes.json`, and the request is
        forwarded unchanged to the service that owns it with an internal token addressed to that
        service. The service re-checks `MCP-Protocol-Version`, `Mcp-Method` and `Mcp-Name` against the
        body and enforces `Origin` (MCP 2026-07-28).

        Other methods (`server/discover`, `tools/list`, `tasks/*`) are not routed yet and answer 501,
        pending P1-15. Streaming responses (SSE) are not supported yet: the gateway buffers the
        service's answer. Tenant API keys only; operator credentials are refused.
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: true
          description: Must be `2026-07-28`; older versions are refused.
          schema: { type: string, const: "2026-07-28" }
        - name: Mcp-Method
          in: header
          required: true
          description: Mirrors the JSON-RPC method. Only `tools/call` is routed in this version.
          schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_./:-]+$' }
        - name: Mcp-Name
          in: header
          required: false
          description: The tool name for `tools/call` (required there), or the task id for `tasks/*`.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$' }
        - name: Origin
          in: header
          required: false
          description: Forwarded unchanged; the service validates it and answers 403 when it is not allowed.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The MCP JSON-RPC request, forwarded unchanged. The gateway does not validate it.
      responses:
        "200":
          description: The service's MCP answer, relayed unchanged. JSON in 0.3.0; SSE is not yet supported.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The tool named in `Mcp-Name` is not in the routing table.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "501": { $ref: "#/components/responses/NotImplemented" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
components:
  responses:
    Invalid:
      description: A field failed validation. `detail` names the rule; it never echoes a secret.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: |
        Missing, malformed or unusable credentials (unknown, revoked, expired, owner disabled, firm
        suspended). Always the same body, so the reason is not revealed.
      headers:
        WWW-Authenticate:
          description: Always `Bearer`.
          schema: { type: string, const: Bearer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The credential is valid but lacks the permission this operation needs.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such object in the caller's firm (objects of other firms look the same).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: The request body exceeds 64 KiB.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: The caller exceeded its request budget (a firm, or the platform operator). `Retry-After` says how many seconds to wait.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (integer, at least 1).
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotImplemented:
      description: This MCP method is valid but not routed yet, or the tool's service has no configured URL.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadGateway:
      description: The service behind this route could not be reached. Nothing was changed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    GatewayTimeout:
      description: The service did not answer within 5 seconds. The outcome is unknown; check before retrying.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      description: RFC 9457 problem details (standard error body for all services).
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Tenant API key (`tlx_<tenant id>.<secret>`), checked on every request.
    operatorKey:
      type: http
      scheme: bearer
      description: The platform operator's credential, held by whoever runs the platform. Compared by hash; configured in the gateway's environment (ADR-0012).
