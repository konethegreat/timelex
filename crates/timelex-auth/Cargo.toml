[package]
name = "timelex-auth"
description = "Internal service authentication for TimeLex: the gateway-signed, short-lived EdDSA token services trust (ADR-0012). No network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["pkcs8"] }
getrandom = "0.4"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
timelex-identity = { path = "../timelex-identity" }
uuid = { version = "1", features = ["v4", "serde"] }
