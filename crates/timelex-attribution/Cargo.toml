[package]
name = "timelex-attribution"
description = "Deterministic attribution stages 0 and 1 for TimeLex: exact hard keys and assignment history. No I/O, no model, no floats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
timelex-types = { path = "../timelex-types" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["macros"] }
timelex-segmentation = { path = "../timelex-segmentation" }
