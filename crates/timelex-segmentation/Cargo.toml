[package]
name = "timelex-segmentation"
description = "Deterministic segmentation of activity events into non-overlapping time blocks. No I/O, no model, no floats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
time = "0.3"
timelex-types = { path = "../timelex-types" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["macros"] }
