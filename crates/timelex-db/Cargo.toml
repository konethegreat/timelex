[package]
name = "timelex-db"
description = "Database layer for TimeLex services: Postgres bootstrap, tenant-scoped transactions, and the tenancy and role-isolation tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Test support (a throwaway database per test). Enable as a dev-dependency feature only.
testing = ["uuid/v4"]

[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
timelex-identity = { path = "../timelex-identity" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = "1"

[dev-dependencies]
proptest = "1"
timelex-db = { path = ".", features = ["testing"] }

