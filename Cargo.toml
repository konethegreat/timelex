[workspace]
resolver = "2"
members = ["crates/timelex-units", "crates/timelex-types", "crates/timelex-identity", "crates/timelex-vault", "crates/timelex-db", "crates/timelex-auth", "crates/timelex-outbox", "services/gateway", "services/identity", "services/vault"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Kone Tshivhinda"]
repository = "https://github.com/konethegreat/timelex"
homepage = "https://github.com/konethegreat/timelex"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
