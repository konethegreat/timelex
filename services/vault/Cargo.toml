[package]
name = "timelex-vault-service"
description = "TimeLex vault service: write-only custody of tenant secrets, with the HTTP API and provider check of contract 0.1.0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
timelex-auth = { path = "../../crates/timelex-auth" }
timelex-db = { path = "../../crates/timelex-db" }
timelex-identity = { path = "../../crates/timelex-identity" }
timelex-vault = { path = "../../crates/timelex-vault" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
uuid = "1"
zeroize = "1"

[dev-dependencies]
timelex-db = { path = "../../crates/timelex-db", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Tests build the master key at run time; uuid 4 supplies the randomness.
uuid = { version = "1", features = ["v4"] }
