[package]
name = "timelex-identity-service"
description = "TimeLex identity service: create a firm, issue and revoke API keys, authenticate. HTTP layer per contracts/openapi/identity.v1.yaml."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
timelex-identity = { path = "../../crates/timelex-identity" }
timelex-db = { path = "../../crates/timelex-db" }
timelex-auth = { path = "../../crates/timelex-auth" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "macros"] }
time = { version = "0.3", features = ["serde-well-known"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
getrandom = "0.4"

[dev-dependencies]
timelex-db = { path = "../../crates/timelex-db", features = ["testing"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
