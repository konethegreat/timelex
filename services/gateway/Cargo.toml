[package]
name = "timelex-gateway"
description = "TimeLex edge gateway: authenticates callers through identity and routes to services (P1-04 part a)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
reqwest = { version = "0.13", default-features = false }
sha2 = "0.11"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
timelex-types = { path = "../../crates/timelex-types" }
timelex-auth = { path = "../../crates/timelex-auth" }
timelex-identity = { path = "../../crates/timelex-identity" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
timelex-db = { path = "../../crates/timelex-db", features = ["testing"] }
timelex-identity-service = { path = "../identity" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
